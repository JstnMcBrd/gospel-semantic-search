name: gospel-semantic-search

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "[::1]:8080:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - 5000
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=6333
    restart: unless-stopped

  db:
    image: qdrant/qdrant:v1.16.2
    expose:
      - 6333 # REST API
      - 6334 # gRPC API
    volumes:
      - db-data:/qdrant/storage
    restart: unless-stopped

  db-init:
    build:
      context: ./db-init
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=6333
    restart: no

  # Uncomment this if you want to run a database operation
  # db-op:
  #   build:
  #     context: ./db-op
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - db
  #   environment:
  #     - DB_HOST=db
  #     - DB_PORT=6333
  #   restart: no

volumes:
  db-data:

networks:
  default:
    enable_ipv6: true
